<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StundenKompass</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- „black" statt „black-translucent": die App beginnt unter der
     Statusleiste, statt darunter durchzulaufen und Abstaende zu brauchen. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="StundenKompass">
<link rel="apple-touch-icon" href="bilder/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-130 -130 260 260'><circle r='125' fill='%2314213D'/><polygon points='0,-104 20,-14 0,-2 -20,-14' fill='%23C9A227'/><polygon points='0,96 16,-2 0,-14 -16,-2' fill='%23F7F5F0'/><circle r='13' fill='%231B2B4A'/></svg>">
</head>
<body>

<!-- Kompass einmal definiert, per <use> an beiden Stellen eingesetzt -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="zkBlau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4F78"/><stop offset="100%" stop-color="#1B2B4A"/>
    </linearGradient>
    <linearGradient id="zkDunkel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/><stop offset="100%" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="zkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C567"/><stop offset="100%" stop-color="#B98F1E"/>
    </linearGradient>
    <linearGradient id="zkNadel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D98C"/><stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7A15"/>
    </linearGradient>
    <symbol id="zkKompass" viewBox="-130 -130 260 260">
      <circle cx="0" cy="0" r="118" fill="#EDEAE1"/>
      <g opacity="0.8">
        <polygon points="0,0 58,-58 8,-8" fill="url(#zkGold)"/>
        <polygon points="0,0 58,-58 -8,-8" fill="#8F6E17"/>
        <polygon points="0,0 58,58 8,8" fill="#8F6E17"/>
        <polygon points="0,0 58,58 -8,8" fill="url(#zkGold)"/>
        <polygon points="0,0 -58,58 -8,8" fill="url(#zkGold)"/>
        <polygon points="0,0 -58,58 8,8" fill="#8F6E17"/>
        <polygon points="0,0 -58,-58 -8,-8" fill="#8F6E17"/>
        <polygon points="0,0 -58,-58 8,-8" fill="url(#zkGold)"/>
      </g>
      <polygon points="0,-98 12,-10 0,0" fill="url(#zkBlau)"/>
      <polygon points="0,-98 -12,-10 0,0" fill="url(#zkDunkel)"/>
      <polygon points="98,0 10,12 0,0" fill="url(#zkBlau)"/>
      <polygon points="98,0 10,-12 0,0" fill="url(#zkDunkel)"/>
      <polygon points="0,98 -12,10 0,0" fill="url(#zkBlau)"/>
      <polygon points="0,98 12,10 0,0" fill="url(#zkDunkel)"/>
      <polygon points="-98,0 -10,-12 0,0" fill="url(#zkBlau)"/>
      <polygon points="-98,0 -10,12 0,0" fill="url(#zkDunkel)"/>
      <circle cx="0" cy="0" r="10" fill="#1B2B4A"/>
      <circle cx="-3" cy="-3" r="4" fill="#4A5F8C"/>
      <g transform="rotate(22.5)">
        <polygon points="0,-118 13,-14 0,-4 -13,-14" fill="url(#zkNadel)"/>
        <polygon points="0,52 10,-4 0,-14 -10,-4" fill="#F7F5F0" stroke="#14213D" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" title="Zahlenkompass">
        <svg role="img" aria-label="Zahlenkompass"><use href="#zkKompass"/></svg>
      </div>
      <div class="brand-text">
        <strong>StundenKompass</strong>
        <span>Zahlenkompass</span>
      </div>
    </div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-foot">
      <button id="themeToggle" class="icon-btn" title="Hell / Dunkel umschalten" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Ansicht</span>
      </button>
      <div class="version" id="version">v1.0 &middot; Schema 1</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="viewTitle">Start</h1>
        <span id="datenName" class="pill"></span>
        <span id="betrachtungHinweis" class="pill" style="background:var(--warn-soft);color:var(--warn)" hidden></span>
      </div>
      <div class="topbar-right">
        <!-- Nur fuer den Admin gefuellt: Umschalter zwischen den Mitarbeitern. -->
        <div id="mitarbeiterSwitch" class="seg seg-sm" title="Mitarbeiter wechseln"></div>
        <div id="saveStatus" class="save-status" title="Speicherstatus">
          <span class="dot"></span><span class="label">Gespeichert</span>
        </div>
        <!-- Nur im Einzelplatz mit Dropbox sichtbar; Klick gleicht sofort ab. -->
        <button id="syncStatus" class="save-status sync-status" type="button" title="Mit Dropbox abgleichen" hidden>
          <span class="dot"></span><span class="label"></span>
        </button>
        <button id="btnFolder" class="btn btn-ghost" type="button" title="Konto und Server – siehe Einstellungen">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.3-3.7 4.2-5.6 7.5-5.6s6.2 1.9 7.5 5.6"/></svg>
          <span id="folderName">Konto</span>
        </button>
        <button id="btnAbmelden" class="btn btn-ghost" type="button" title="Abmelden">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>
</div>

<div id="startup" class="startup">
  <div class="startup-card">
    <div class="startup-logo">
      <svg role="img" aria-label="Zahlenkompass"><use href="#zkKompass"/></svg>
    </div>
    <h1>StundenKompass</h1>
    <div class="startup-marke">Zahlenkompass</div>
    <div class="startup-claim">Klarheit für deine Zahlen</div>
    <p class="startup-sub">Arbeitszeiten erfassen, Überstunden und Urlaub im Blick behalten.</p>
    <div id="startupBody" class="startup-body">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
